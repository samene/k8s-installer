- name: Download runsc
  ansible.builtin.get_url:
    url: "{{ runsc_download_url }}/{{runsc_version}}/{{ansible_facts.architecture|lower}}/gvisor.tar.zstd"
    dest: "/tmp/gvisor.tar.zstd"
    force: false
    mode: '0755'
  when: "'worker' in group_names"

- name: Untar and install
  ansible.builtin.command:
    cmd: "tar --zstd -xf gvisor.tar.zstd -C /usr/local/bin"
  args:
    chdir: /tmp
  when: "'worker' in group_names"

- name: Create gVisor RuntimeClass
  ansible.builtin.command:
    cmd: /usr/local/bin/kubectl apply -f -
    stdin: |
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: gvisor
      handler: runsc
  when: "'control_plane' in group_names"

- name: Remove gVisor archive
  ansible.builtin.file:
    path: /tmp/gvisor.tar.zstd
    state: absent
  when: "'worker' in group_names"

